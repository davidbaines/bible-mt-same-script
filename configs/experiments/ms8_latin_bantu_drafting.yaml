# latin-bantu drafting condition
# Hyperparameters inherit from bible-interlingua's ms8_ie_shareable
# so the same-script comparison changes one variable (spec.md).
name: ms8_latin_bantu_drafting
phase: multi-source

data:
  selection: experiments/selection-latin-bantu.csv
  holdouts: configs/holdouts-latin-bantu-drafting.yaml
  source: sna
  companion_ranking: coverage   # v1 behaviour, uniform across all runs
  pairing: multi-source
  k: 8
  k_min: 1
  max_len: 192
  max_src_len: 640
  max_ratio: 0

tokenizer:
  type: bpe
  vocab_size: 32000

model:                    # transformer-big (~210M)
  arch: marian
  encoder_layers: 6
  decoder_layers: 6
  d_model: 1024
  encoder_attention_heads: 16
  decoder_attention_heads: 16
  encoder_ffn_dim: 4096
  decoder_ffn_dim: 4096
  dropout: 0.1
  label_smoothing: 0.1

training:
  optimizer: adamw
  lr: 5.0e-4
  warmup_steps: 4000
  lr_scheduler: cosine
  per_device_batch_size: 32     # max_src_len 640 on 40 GB; effective 256 seqs
  gradient_accumulation: 8
  max_grad_norm: 1.0
  bf16: true
  max_steps: 100000             # ceiling; probe early-stopping usually ends sooner
  eval_every_steps: 2000
  seed: 13

inference:
  beam: 5
  length_penalty: 1.0
  max_length: 192

validation:                    # disjoint from train AND test (v2 policy)
  every_steps: 1000
  verses_per_language: 250
  min_gain: 0.2                 # silnlp early-stop defaults
  patience_steps: 4000
  batch_size: 32
  seed: 13

oversample_holdouts: 1
