# Smoke experiment: tiny end-to-end run on the local 3090. Small model, 3
# Devanagari translations, Hindi as the forced source, multi-source pairing,
# one small held-out book plus the Genesis-250 verse list, and a validation
# section so the disjoint validation set and early stopping are exercised.
# Never an H100 run.
name: smoke
phase: multi-source

data:
  selection: experiments/selection-smoke.csv
  holdouts: configs/holdouts-smoke.yaml
  source: hin2017
  companion_ranking: coverage
  pairing: multi-source
  k: 3
  k_min: 1
  max_len: 128
  max_src_len: 384
  max_ratio: 0

tokenizer:
  type: bpe
  vocab_size: 4000

model:                    # deliberately tiny; NOT transformer-big
  arch: marian
  encoder_layers: 2
  decoder_layers: 2
  d_model: 256
  encoder_attention_heads: 4
  decoder_attention_heads: 4
  encoder_ffn_dim: 512
  decoder_ffn_dim: 512
  dropout: 0.1
  label_smoothing: 0.1

training:
  lr: 5.0e-4
  warmup_steps: 200
  lr_scheduler: inverse_sqrt
  per_device_batch_size: 64
  gradient_accumulation: 1
  max_grad_norm: 1.0
  bf16: true
  max_steps: 1500
  early_stopping_patience: 5
  eval_every_steps: 250
  seed: 13

inference:
  beam: 5
  length_penalty: 1.0
  max_length: 128

validation:               # disjoint from train AND test (v2 policy)
  every_steps: 500
  verses_per_language: 100
  min_gain: 0.2
  patience_steps: 1000
  batch_size: 64
  seed: 13

